name: laravel/pulse
category: Debugging
tags: [monitoring, performance, dashboard]
install:
  - 'composer require laravel/pulse'
  - 'php artisan vendor:publish --provider="Laravel\Pulse\PulseServiceProvider"'
  - 'php artisan migrate'
supported:
